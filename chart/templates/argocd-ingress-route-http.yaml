---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-http
  namespace: argocd
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`deployments.home.derwitt.net`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
      middlewares:
        - name: redirect-to-https@kubernetescrd
          namespace: traefik
