apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  syncPolicy:
    automated: {}
  destination:
    namespace: argocd
    server: {{ .Values.destination.server }}
  source:
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 7.5.0
    chart: argo-cd
    helm:
      releaseName: argocd
      values: |

        global:
          domain: {{ .Values.global.domain }}
        securityContext:
          fsGroup: 1000
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        networkPolicy:
          create: true
        controller:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
            rules:
              enabled: true
              spec:
                - alert: ArgoAppMissing
                  expr: |
                    absent(argocd_app_info) == 1
                  for: 15m
                  labels:
                    severity: critical
                  annotations:
                    summary: "[Argo CD] No reported applications"
                    description: >
                      Argo CD has not reported any applications data for the past 15 minutes which
                      means that it must be down or not functioning properly.  This needs to be
                      resolved for this cloud to continue to maintain state.
                - alert: ArgoAppNotSynced
                  expr: |
                    argocd_app_info{sync_status!="Synced"} == 1
                  for: 12h
                  labels:
                    severity: warning
                  annotations:
                    summary: "[{{`{{$labels.name}}`}}] Application not synchronized"
                    description: >
                      The application [{{`{{$labels.name}}`}} has not been synchronized for over
                      12 hours which means that the state of this cloud has drifted away from the
                      state inside Git.
        redis:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        server:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          ingress:
            enabled: false
        repoServer:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        applicationSet:
          allowAnyNamespace: true
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        notifications:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        dex:
          env:
            - name: MICROSOFT_APPLICATION_ID
              valueFrom:
                secretKeyRef:
                  name: dex-secrets
                  key: microsoft-application-id
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-secrets
                  key: microsoft-client-secret
            - name: MICROSOFT_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: dex-secrets
                  key: microsoft-tenant-id
        configs:
          cm:
            application.resourceTrackingMethod: annotation
            admin.enabled: false
            dex.config: |

              connectors:
                - type: microsoft
                  id: microsoft
                  name: Microsoft
                  config:
                    clientID: "$MICROSOFT_APPLICATION_ID"
                    clientSecret: "$MICROSOFT_CLIENT_SECRET"
                    redirectURI: http://127.0.0.1:8080/api/dex/callback
                    tenant: "$MICROSOFT_TENANT_ID"
                    emailToLowercase: true
                    onlySecurityGroups: true
                    groups:
                      - k8s-admins
            resource.exclusions: |
              - apiGroups:
                  - cilium.io
                kinds:
                  - CiliumIdentity
                clusters:
                  - "*"
            resource.customizations: |
              cert-manager.io/Certificate:
                health.lua: |
                  hs = {}
                  if obj.status ~= nil then
                    if obj.status.conditions ~= nil then
                      for i, condition in ipairs(obj.status.conditions) do
                        if condition.type == "Ready" and condition.status == "False" then
                          hs.status = "Degraded"
                          hs.message = condition.message
                          return hs
                        end
                        if condition.type == "Ready" and condition.status == "True" then
                          hs.status = "Healthy"
                          hs.message = condition.message
                          return hs
                        end
                      end
                    end
                  end

                  hs.status = "Progressing"
                  hs.message = "Waiting for certificate"
                  return hs
          rbac:
            policy.default: role:readonly
            policy.csv: |
              p, role:org-admin, applications, *, */*, allow
              p, role:org-admin, clusters, get, *, allow
              p, role:org-admin, clusters, create, *, allow
              p, role:org-admin, clusters, update, *, allow
              p, role:org-admin, clusters, delete, *, allow
              p, role:org-admin, repositories, get, *, allow
              p, role:org-admin, repositories, create, *, allow
              p, role:org-admin, repositories, update, *, allow
              p, role:org-admin, repositories, delete, *, allow
              g, k8s-admins, role:org-admin
          params:
            server.insecure: true
            application.namespaces: foundry
            applicationsetcontroller.namespaces: foundry
            applicationsetcontroller.allowed.scm.providers: https://github.com/wittdennis
            applicationsetcontroller.enable.scm.providers: false
