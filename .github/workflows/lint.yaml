    with:
      requirements-file: ansible/requirements.yml

  yaml-lint:
    uses: wittdennis/pipelines/.github/workflows/yaml-lint.yaml@43a933c8b6cf02c324997261163fd029dbf5cd6c # 2.0.14
    with:
      yamllint-path: .yamllint
