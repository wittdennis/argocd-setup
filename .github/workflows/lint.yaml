    with:
      requirements-file: ansible/requirements.yml

  yaml-lint:
    uses: wittdennis/pipelines/.github/workflows/yaml-lint.yaml@29f41b6d8146f7189dce232aa5a23ee635f7cbe0 # 2.0.2
    with:
      yamllint-path: .yamllint
