    with:
      requirements-file: ansible/requirements.yml

  yaml-lint:
    uses: wittdennis/pipelines/.github/workflows/yaml-lint.yaml@074d25eb9a24f5ccd89dd2ef96fd1826107895f9 # 2.0.43
    with:
      yamllint-path: .yamllint
