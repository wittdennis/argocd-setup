---
- name: Gather current cli version
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      /usr/local/bin/argocd version --client --short | cut -d " " -f 2 | cut -d "+" -f 1
  register: argocd_cli_version
  changed_when: false
  failed_when: false

- name: Download argocd cli
  when: argocd_cli_version.stdout != argocd_version
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/argoproj/argo-cd/releases/download/{{ argocd_version }}/argocd-linux-{{ argocd_cli_arch }}"
    dest: "/usr/local/bin/argocd"
    owner: root
    group: root
    mode: "0755"
