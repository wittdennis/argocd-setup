---
- name: Remove argocd
  kubernetes.core.helm:
    name: argocd
    state: absent
    release_namespace: argocd
    wait: true

- name: Remove argocd helm repo
  kubernetes.core.helm_repository:
    name: argo
    state: absent

- name: Remove argocd namespace
  kubernetes.core.k8s:
    name: argocd
    api_version: v1
    kind: Namespace
    state: absent

- name: Remove cli
  ansible.builtin.file:
    path: /usr/local/bin/argocd
    state: absent
